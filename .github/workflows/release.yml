name: 建置與發布 Windows 預覽版
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 產生 Plugin 與測試
        run: |
          python -m pip install tomlkit==0.13.3
          python scripts/create_content.py
          python scripts/build_guides.py --check
          python -m unittest discover -s tests -v
      - name: 建置完整安裝包
        run: |
          python scripts/build_payload.py
          dotnet publish installer/CadToolkitSetup.csproj -c Release -o dist/setup
          python scripts/finalize_release.py
      - name: 盤點主程式與巢狀套件的程式簽章
        shell: pwsh
        run: |
          python scripts/signing_inventory.py --payload dist/cad-toolkit-payload.zip --installer dist/McpToolkitSetup.exe --output .build/signing-inventory.json
          ./scripts/audit_signatures.ps1 -Inventory .build/signing-inventory.json -Output dist/signature-audit.json
      - name: 檢查新管理介面與安裝畫面
        run: dotnet run --project tests/desktop/DesktopChecks.csproj -c Release -- test-results/desktop
      - name: 檢查自動更新與完整解除安裝
        run: |
          dotnet run --project tests/updates/UpdateChecks.csproj -c Release
          dotnet run --project tests/updates/UpdateChecks.csproj -c Release -- --repro-update-feedback
          dotnet run --project tests/desktop/DesktopChecks.csproj -c Release -- test-results/update-responsive --repro-update-responsive
          dotnet run --project tests/desktop/DesktopChecks.csproj -c Release -- test-results/lt-interface --repro-lt-ui
          dotnet run --project tests/desktop/DesktopChecks.csproj -c Release -- test-results/mcp-management --repro-mcp-management
          dotnet run --project tests/desktop/DesktopChecks.csproj -c Release -- test-results/management-refresh --repro-management-refresh
      - name: 檢查打包後 Rhino 視窗保護
        shell: pwsh
        run: |
          .build/payload/uv.exe venv --python .build/payload/runtime/python.exe .build/guard-check-env
          $rhinoSpec = (Get-Content sources.json | ConvertFrom-Json).components.rhino
          .build/payload/uv.exe pip install --python .build/guard-check-env/Scripts/python.exe --no-index --find-links .build/payload/wheels/rhino "rhinomcp==$($rhinoSpec.package_version)"
          .build/guard-check-env/Scripts/python.exe -m unittest discover -s tests -p rhino_server_guard_checks.py -v
          $rhinoSource = (Resolve-Path ".build/patched/rhino/$($rhinoSpec.patch_sha256)").Path
          dotnet run --project tests/rhino-tray/RhinoTrayChecks.csproj -c Release "-p:RhinoPatchSource=$rhinoSource"
      - uses: actions/upload-artifact@v4
        with:
          name: cad-toolkit-windows
          path: |
            dist/McpToolkitSetup.exe
            dist/McpToolkit.exe
            dist/cad-toolkit-payload.zip
            dist/release-manifest.json
            dist/SHA256SUMS.txt
            dist/signature-audit.json
      - name: 發布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content sources.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag 與來源版本不一致' }
          $notes = "docs/release-$version.md"
          if (!(Test-Path -LiteralPath $notes)) { $notes = 'docs/validation.md' }
          $releaseTitle = "MCP Toolkit $version"
          if ($version.Contains('-')) { $releaseTitle += ' — Beta 測試版' }
          $releaseArgs = @('release','create',$env:GITHUB_REF_NAME,'--title',$releaseTitle,'--notes-file',$notes)
          if ($version.Contains('-')) { $releaseArgs += '--prerelease' }
          $published = gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0 -and $published -eq 'false') {
            Write-Output '此版本已發布，保留已驗證的下載檔案。'
            exit 0
          }
          $signatureAudit = Get-Content -LiteralPath dist/signature-audit.json -Raw | ConvertFrom-Json
          if (-not $signatureAudit.all_signatures_valid) {
            throw '尚未完成可信任的程式簽章，停止公開發布。測試檔可從 Actions artifact 取得，但不可宣稱已相容 Smart App Control。'
          }
          gh @releaseArgs dist/McpToolkitSetup.exe dist/McpToolkit.exe dist/cad-toolkit-payload.zip dist/release-manifest.json dist/SHA256SUMS.txt
